name: 文档
description: 错字、过时说明、缺示例、示例和正文对不上
title: "[Docs]: "
labels: ["documentation"]
body:
  - type: markdown
    attributes:
      value: |
        先搜一下 [已有 Issue](https://github.com/ArturoYi/fast_package/issues)。贡献说明见 [贡献](https://arturoyi.github.io/fast_package/community/contributing.html)。
        文档和代码行为不符时，用「Bug」模板，相关模块选「文档 / 示例」。能直接改的也可以提 Pull Request，文档在 `docs/`。
  - type: input
    id: page
    attributes:
      label: 页面
      description: 文档路径或链接，并注明中文或 English。
      placeholder: "docs/ui/toast.md"
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: 问题
      description: 哪里不对、缺了什么，或哪段不好懂。
    validations:
      required: true
  - type: textarea
    id: suggestion
    attributes:
      label: 建议
      description: 期望怎么改。没有完整改法也可以，写清你卡住的地方即可。
    validations:
      required: true
